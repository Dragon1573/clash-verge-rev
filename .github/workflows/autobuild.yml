name: Auto Build

on:
  workflow_dispatch:
  workflow_run:
    branches: [ dev ]
    workflows: [ Sync Upstream ]
    types: [ completed ]
permissions: write-all
env:
  TAG_NAME: daily
  TAG_CHANNEL: Daily
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  HUSKY: 0
concurrency:
  group: "${{ github.workflow }} - ${{ github.head_ref || github.ref }}"
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check_commit:
    name: Check Commit Needs Build
    uses: ./.github/workflows/check-commit-needs-build.yml
    with:
      tag_name: daily
      force_build: ${{ github.event_name == 'workflow_dispatch' }}

  update_tag:
    name: Update tag
    runs-on: ubuntu-latest
    needs: check_commit
    if: ${{ needs.check_commit.outputs.should_run == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 50

      - uses: pnpm/action-setup@v6.0.8
        name: Install pnpm
        with:
          run_install: false

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: "24.16.0"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Release AutoBuild Version
        run: pnpm release-version autobuild-latest

      - name: Set Env
        run: |
          echo "BUILDTIME=$(TZ=Asia/Shanghai LANG=zh_CN.UTF-8 date)" >> $GITHUB_ENV
          VERSION=$(jq -r .version package.json)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "DOWNLOAD_URL=https://github.com/clash-verge-rev/clash-verge-rev/releases/download/daily" >> $GITHUB_ENV
        shell: bash

      - name: Fetch UPDATE logs
        id: fetch_update_logs
        run: bash ./scripts/extract_update_logs.sh
        shell: bash

      - name: Generate Release Notes
        run: |
          if [ -z "$UPDATE_LOGS" ]; then
            echo "No update logs found, using default message"
            UPDATE_LOGS="More new features are now supported. Check for detailed changelog soon."
          else
            echo "Using found update logs"
          fi

          cat > release.txt << EOF
          $UPDATE_LOGS

          -----

          ### :warning: 额外魔改

          - 修改 Autobuild 版本号格式，对比官方构建更短，易于识别也用于特殊区分
          - 移除 macOS 构建
          - **替换使用非官方 Tauri 签名密钥**
          - 升级 Nodejs 版本，统一使用 \`v24.x\`
          - 更新 GitHub Workflows 用于构建的操作系统版本
            - \`windows-latest\` -> \`windows-2025-vs2026\`
          - 移除 \`aarch64\` / \`armv7\` 架构，同步移除 Windows WebView2-bundled 版本

          > [!CAUTION]
          > 
          > 这是来自第三方 Contributor 的 **非官方** 构建，仅用于验证构建流水线是否正常。
          > 
          > 不要在任何时候使用这个构建！

          版本构建时间：${{ env.BUILDTIME }}
          EOF

      - name: Upload Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "Clash Verge Rev ${{ env.TAG_CHANNEL }} (Forked Build)"
          body_path: release.txt
          token: ${{ secrets.GITHUB_TOKEN }}
          generate_release_notes: false

  clean_old_assets:
    name: Clean Old Release Assets
    needs: [ check_commit, update_tag ]
    if: ${{ needs.check_commit.outputs.should_run == 'true' && needs.update_tag.result == 'success' }}

    uses: ./.github/workflows/clean-old-assets.yml
    with:
      tag_name: daily
      dry_run: false

  autobuild-amd64-windows:
    name: Autobuild amd64 Windows and Linux
    needs: [ check_commit, update_tag ]
    if: ${{ needs.check_commit.outputs.should_run == 'true' }}
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 50

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          targets: ${{ matrix.target }}

      - name: Add Rust Target
        run: rustup target add x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/dev' }}
          prefix-key: "v1-rust"
          key: "rust-shared-stable-${{ matrix.os }}-${{ matrix.target }}"
          workspaces: |
            . -> target
          cache-all-crates: true
          cache-workspace-crates: true

      - uses: pnpm/action-setup@v6.0.8
        name: Install pnpm
        with:
          run_install: false

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: "24.16.0"
          cache: "pnpm"

      - name: Pnpm Cache
        uses: actions/cache@v5
        with:
          path: ~/.pnpm-store
          key: "pnpm-shared-stable-${{ matrix.os }}-${{ matrix.target }}"
          restore-keys: |
            pnpm-shared-stable-windows-2025-vs2026-x86_64-pc-windows-msvc

      - name: Pnpm install and check
        run: |
          pnpm i
          pnpm run prebuild x86_64-pc-windows-msvc

      - name: Release ${{ env.TAG_CHANNEL }} Version
        run: pnpm release-version autobuild-latest

      - name: Add Rust Target
        run: |
          # Ensure cross target is installed for the pinned toolchain; fallback without explicit toolchain if needed
          rustup target add x86_64-pc-windows-msvc --toolchain 1.95.0 || rustup target add x86_64-pc-windows-msvc
          rustup target list --installed
          echo "Rust target x86_64-pc-windows-msvc installed."

      - name: Hijack Tauri signing key
        shell: bash
        run: |
          # Hijack Tauri signing key
          echo "::group::Hijacking public key..."
          ORIGINAL_PUBLIC_KEY=$(cat src-tauri/tauri.conf.json | jq ".plugins.updater.pubkey" | tr -d '"')
          echo "Original key: $ORIGINAL_PUBLIC_KEY"
          sed -i "s/$ORIGINAL_PUBLIC_KEY/${{ vars.TAURI_SIGNING_PUBLIC_KEY }}/" src-tauri/tauri.conf.json
          echo "Hijacked key: "$(cat src-tauri/tauri.conf.json | jq ".plugins.updater.pubkey" | tr -d '"')
          echo "::endgroup::"

      - name: Tauri build for Windows-Linux
        uses: tauri-apps/tauri-action@v0
        continue-on-error: true
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CARGO_PROFILE_RELEASE_BUILD_OVERRIDE_DEBUG: true
        with:
          tagName: ${{ env.TAG_NAME }}
          releaseName: "Clash Verge Rev ${{ env.TAG_CHANNEL }}"
          releaseBody: "More new features are now supported."
          releaseDraft: false
          tauriScript: pnpm
          args: --target x86_64-pc-windows-msvc
          # includeUpdaterJson: true

  label-release-assets:
    name: Label Release Assets
    needs: [ autobuild-amd64-windows ]
    if: needs.autobuild-amd64-windows.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Set user-friendly assets name
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get ID of the latest release
          echo "::group::Get ID of the latest release"
          LATEST_RELEASE_ID=$(gh api "repos/${{ github.repository }}/releases/latest" | jq -r .id | tr -d "\r")
          echo "::endgroup::"

          # Get all assets
          echo "::group::Get all assets"
          ASSETS_ID=$(gh api "repos/${{ github.repository }}/releases/${LATEST_RELEASE_ID}/assets" | jq -r ".[].id" | tr -d "\r")
          echo "::endgroup::"

          for ID in $ASSETS_ID; do
            echo "::group::Processing asset ID: $ID"

            # Get asset name
            ASSET_NAME=$(gh api "repos/${{ github.repository }}/releases/assets/${ID}" | jq -r .name | tr -d "\r")

            # Generate label of the asset
            LABEL="Amd64 "
            if [[ "$ASSET_NAME" =~ "json" ]]; then
              LABEL="Version Information JSON"
            elif [[ "$ASSET_NAME" =~ "exe" ]]; then
              LABEL+="Windows EXE Installer "
            fi
            if [[ "$ASSET_NAME" =~ "sig" ]]; then
              LABEL+="Signature"
            fi

            # Set a label to the asset
            gh api --method PATCH \
              "repos/${{ github.repository }}/releases/assets/${ID}" \
              -f "name=$ASSET_NAME" -f "label=$LABEL" |
            jq '{ name: .name, label: .label }'

            echo "::endgroup::"
          done
