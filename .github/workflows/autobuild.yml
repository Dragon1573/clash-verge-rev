name: Auto Build

on:
  workflow_call:
    secrets:
      TAURI_PRIVATE_KEY:
        required: true
      TAURI_KEY_PASSWORD:
        required: true
      TELEGRAM_BOT_TOKEN:
        required: true
  workflow_dispatch:
permissions:
  contents: write
  actions: read
env:
  TAG_NAME: autobuild
  TAG_CHANNEL: AutoBuild
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  HUSKY: 0
concurrency:
  group: "${{ github.workflow }} - ${{ github.head_ref || github.ref }}"
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check_commit:
    name: Check Commit Needs Build
    uses: ./.github/workflows/check-commit-needs-build.yml
    with:
      tag_name: autobuild
      force_build: ${{ github.event_name == 'workflow_dispatch' }}

  update_tag:
    name: Update tag
    runs-on: ubuntu-latest
    needs: check_commit
    if: ${{ needs.check_commit.outputs.should_run == 'true' }}
    outputs:
      release_id: ${{ steps.upload_release.outputs.id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # We need at least 50 latest commits for following scripts to
          # calculate the correct SHA. By default the action will fetch
          # only latest 1 commit with shallow fetch. This will confuse
          # the hash calculation.
          fetch-depth: 50

      - name: Fetch UPDATE logs
        id: fetch_update_logs
        run: bash ./scripts/extract_update_logs.sh
        shell: bash

      - uses: pnpm/action-setup@v6.1.0
        name: Install pnpm
        with:
          run_install: false

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.20.0'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Release AutoBuild Version
        run: pnpm release-version autobuild-latest

      - name: Set Env
        run: |
          echo "BUILDTIME=$(TZ=Asia/Shanghai date)" >> $GITHUB_ENV
          VERSION=$(jq -r .version package.json)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
        shell: bash

      - name: Generate Release Notes
        run: |
          if [ -z "$UPDATE_LOGS" ]; then
            echo "No update logs found, using default message"
            UPDATE_LOGS="More new features are now supported. Check for detailed changelog soon."
          else
            echo "Using found update logs"
          fi

          cat > release.txt << EOF
          $UPDATE_LOGS

          > [!WARNING]
          >
          > 除非你是被我（aka. [**@Dragon1573**](https://github.com/Dragon1573)）的评论亲自引导到这里来的，否则 **不要使用此 Fork 里的任何内容** ！
          >
          > 此 Fork 中的所有构建仅为个人概念验证，不建议作为长期使用的版本。请在体验后尽快卸载并回归官方版本！
          >
          > - 官方最新稳定版本：[Stable Version](https://github.com/clash-verge-rev/clash-verge-rev/releases/latest)
          > - 官方最新预览版本：[Autobuild Version](https://github.com/clash-verge-rev/clash-verge-rev/releases/tag/autobuild)

          Created at ${{ env.BUILDTIME }}.
          EOF

      - name: Upload Release
        id: upload_release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG_NAME }}
          target_commitish: ${{ github.sha }}
          name: "Clash Verge Rev ${{ env.TAG_CHANNEL }}"
          body_path: release.txt
          prerelease: true
          token: ${{ secrets.GITHUB_TOKEN }}
          generate_release_notes: false

  clean_old_assets:
    name: Clean Old Release Assets
    needs: [check_commit, update_tag]
    if: ${{ needs.check_commit.outputs.should_run == 'true' && needs.update_tag.result == 'success' }}

    uses: ./.github/workflows/clean-old-assets.yml
    with:
      tag_name: autobuild
      dry_run: false

  autobuild-windows-x64:
    name: Autobuild Windows x64
    needs: [check_commit, update_tag]
    if: ${{ needs.check_commit.outputs.should_run == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 50

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.98.1'
          targets: ${{ matrix.target }}

      - name: Add Rust Target
        run: rustup target add ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/dev' }}
          prefix-key: "v1-rust"
          key: "rust-shared-stable-${{ matrix.os }}-${{ matrix.target }}"
          workspaces: |
            . -> target
          cache-all-crates: true
          cache-workspace-crates: true

      - uses: pnpm/action-setup@v6.1.0
        name: Install pnpm
        with:
          run_install: false

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.20.0'
          cache: 'pnpm'

      - name: Pnpm Cache
        uses: actions/cache@v6
        with:
          path: ~/.pnpm-store
          key: "pnpm-shared-stable-${{ matrix.os }}-${{ matrix.target }}"
          restore-keys: |
            pnpm-shared-stable-${{ matrix.os }}-${{ matrix.target }}

      - name: Pnpm install and check
        run: |
          pnpm i
          pnpm run prebuild ${{ matrix.target }}

      - name: Release ${{ env.TAG_CHANNEL }} Version
        run: pnpm release-version autobuild-latest

      - name: Add Rust Target
        run: |
          rustup target add ${{ matrix.target }} --toolchain 1.98.1 || rustup target add ${{ matrix.target }}
          rustup target list --installed
          echo "Rust target ${{ matrix.target }} installed."

      - name: Tauri build for Windows x64
        uses: tauri-apps/tauri-action@v1
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.update_tag.outputs.release_id }}
          tagName: ${{ env.TAG_NAME }}
          releaseName: "Clash Verge Rev ${{ env.TAG_CHANNEL }}"
          releaseBody: "More new features are now supported."
          releaseDraft: false
          prerelease: true
          tauriScript: pnpm
          args: --target ${{ matrix.target }}

      - name: Label assets for readability
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          # Fetch assets list from the release
          assets_json=$(gh api repos/${{ github.repository }}/releases/${{ needs.update_tag.outputs.release_id }}/assets)

          # Loop through each asset, identify its extension/type and update its label
          echo "$assets_json" | jq -c '.[]' | while read -r asset; do
            asset_id=$(echo "$asset" | jq -r '.id')
            asset_name=$(echo "$asset" | jq -r '.name')
            
            label=""
            if [[ "$asset_name" == *".exe.sig" ]]; then
              label="Windows x64 EXE signature"
            elif [[ "$asset_name" == *".exe" ]]; then
              label="Windows x64 EXE installer"
            elif [[ "$asset_name" == "latest.json" ]]; then
              label="Metadata JSON"
            fi
            
            if [ -n "$label" ]; then
              echo "Labelling asset '$asset_name' (ID: $asset_id) as '$label'..."
              gh api --method PATCH \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2026-03-10" \
                "repos/${{ github.repository }}/releases/assets/$asset_id" \
                -f label="$label" > /dev/null
            else
              echo "Skipping asset '$asset_name'"
            fi
          done

  notify-telegram:
    name: Notify Telegram
    runs-on: ubuntu-latest
    needs: [update_tag, autobuild-windows-x64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 50

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.20.0'

      - uses: pnpm/action-setup@v6.1.0
        name: Install pnpm
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Release AutoBuild Version
        run: pnpm release-version autobuild-latest

      - name: Get Version and Release Info
        run: |
          sudo apt-get update
          sudo apt-get install jq
          echo "VERSION=$(jq -r '.version' package.json)" >> $GITHUB_ENV
          echo "DOWNLOAD_URL=https://github.com/Dragon1573/clash-verge-rev/releases/download/daily" >> $GITHUB_ENV
          echo "BUILDTIME=$(TZ=Asia/Shanghai date)" >> $GITHUB_ENV

      - name: Fetch UPDATE logs
        id: fetch_update_logs
        run: bash ./scripts/extract_update_logs.sh
        shell: bash

      - name: Generate release.txt
        run: |
          if [ -z "$UPDATE_LOGS" ]; then
            echo "No update logs found, using default message"
            UPDATE_LOGS="More new features are now supported. Check for detailed changelog soon."
          else
            echo "Using found update logs"
          fi

          cat > release.txt << EOF
          $UPDATE_LOGS

          Created at ${{ env.BUILDTIME }}.
          EOF

      - name: Send Telegram Notification
        run: node scripts/telegram.mjs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          BUILD_TYPE: autobuild
          VERSION: ${{ env.VERSION }}
          DOWNLOAD_URL: ${{ env.DOWNLOAD_URL }}
